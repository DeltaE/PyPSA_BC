[project]
name = "pypsa-bc"
version = "0.2.0"
description = "PyPSA-BC: British Columbia power-system model (data prep + network build)."
authors = [{ name = "Md Eliasinul Islam" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pypsa>=0.28",
    "atlite>=0.2.12",
    "geopandas>=0.14",
    "pandas>=2.0",
    "numpy>=1.26",
    "xarray>=2024.1",
    "dask>=2024.1",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "openpyxl>=3.1",
    "tqdm>=4.66",
    "colorama>=0.4.6",
    "pygadm>=0.5.3",
    "geojson>=3.3.0",
    "folium>=0.20.0",
    "gurobipy>=13.0.2",
    "highspy>=1.15.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

# uv recognises this as the project root. `uv sync` builds the env,
# `uv run python -m workflow.run_pypsa_bc` runs the pipeline.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pypsa_bc"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
src = ["src", "workflow"]
