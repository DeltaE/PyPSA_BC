# data.yaml — file and directory locations ONLY. No parameters, no assumptions.
# All paths are relative to the repo root. Accessed via AttributesParser.data_cfg.
# Run-parameters live in params.yaml; electrical assumptions in base_network.yaml;
# CODERS pull config in coders.yaml.

roots:
  downloaded: data/downloaded_data
  processed: data/processed_data
  custom: data/custom
  results: results

# ---------------------------------------------------------------- inputs
GADM:
  country_file_L1: data/downloaded_data/GADM/gadm41_CAN_1.geojson # provinces
  country_file_L2: data/downloaded_data/GADM/gadm41_CAN_2.geojson # admin regions

basin_files:
  na_file: data/downloaded_data/HydroBASINS/hybas_na_lev12_v1c.shp
  arctic_file: data/downloaded_data/HydroBASINS_arctic/hybas_ar_lev12_v1c.shp

# BC Hydro / Water Use Plan derived, manually curated (see also params.yaml)
inventory:
  gen_wup: data/inventory/custom/hydro_gen_wup_features.csv
  res_wup: data/inventory/custom/hydro_res_wup_features.csv
  inflow_tables: data/inventory/custom/inflow_stats # dir of {reservoir_id}.csv
  line_table: data/inventory/custom/electric_power_generation_table_13_3a.xlsx
  cascade_reference: data/inventory/cascade_reference.csv
  cascade_evidence_register: studies/chapter2/inputs/cascade_evidence_register.csv
  release_schedules: studies/chapter2/inputs/release_schedules.csv
  hydraulic_route_overrides: data/validation/chapter2/hydraulic_route_overrides.csv
  base_network_node_corrections: data/validation/base_network/node_corrections.csv
  base_network_line_corrections: data/validation/base_network/line_corrections.csv
  base_network_component_policy: data/validation/base_network/component_policy.yaml
data:
  # CODERS API pulls. Locations mirror coders.yaml (root + tables); keep in sync.
  coders:
    generators: data/downloaded_data/CODERS/data-pull/supply/generators.csv
    gen_generic: data/downloaded_data/CODERS/data-pull/supply/generation_generic.csv
    hydro_existing: data/downloaded_data/CODERS/data-pull/supply/existing_hydro.csv
    # hydro_cascade: data/downloaded_data/CODERS/data-pull/supply/hydro_cascade.csv # CODERS doesn't have this, EL_20270724
    lines: data/downloaded_data/CODERS/data-pull/network/transmission_lines.csv
    substations: data/downloaded_data/CODERS/data-pull/network/substations.csv
  wind:
    can_turbines: data/downloaded_data/wind/canada_turbines.xlsx
    turbine_dict: data/downloaded_data/wind/turbine_dict.json
    gwa_speed: data/downloaded_data/wind/CAN_wind-speed_100m.tif
    gwa_geojson: data/downloaded_data/wind/CAN.geojson
  load:
    ceei: data/downloaded_data/load/CEEI_2022.xlsx
    cee_transport: data/downloaded_data/load/CEEI_TRA_2022.xlsx
    bch: data/downloaded_data/load/bc_hydro_load/BalancingAuthorityLoad # + <year>.xls
  cutout: data/downloaded_data/cutout/BC_2021_2022.nc

# ---- remote inputs to fetch (workflow/scripts/fetch_inputs.py) ----
# dest mirrors the local path above; url is the authoritative public source.
remote:
  bc_hydro_transmission_map:
    url: https://www.bchydro.com/content/dam/BCHydro/customer-portal/documents/transmission/maps/transmission-system.pdf
    dest: data/validation/base_network/bc_hydro_transmission_system_2025.pdf
    metadata: data/validation/base_network/bc_hydro_transmission_system_2025.metadata.json
  can_turbines:
    url: https://ftp.cartes.canada.ca/pub/nrcan_rncan/Wind-energy_Energie-eolienne/wind_turbines_database/Wind_Turbine_Database_FGP.xlsx
    dest: data/downloaded_data/wind/canada_turbines.xlsx # Canadian Wind Turbine Database (NRCan, OGL-Canada)
  HydroBASINS:
    url: https://data.hydrosheds.org/file/hydrobasins/standard/hybas_na_lev01-12_v1c.zip
    dest: data/downloaded_data/HydroBASINS/hybas_na_lev12_v1c.zip
  HydroBASINS_arctic:
    url: https://data.hydrosheds.org/file/hydrobasins/standard/hybas_ar_lev01-12_v1c.zip
    dest: data/downloaded_data/HydroBASINS_arctic/hybas_ar_lev12_v1c.zip
  GWA_wind_speed:
    url: https://gwa.cdn.nazkamapps.com/country_tifs_v4/CAN_wind-speed_100m.tif
    dest: data/downloaded_data/wind/CAN_wind-speed_100m.tif
  GWA_geojson:
    url: https://globalwindatlas.info/c52f880d-d656-491d-bd95-94ec154cab07
    dest: data/downloaded_data/wind/CAN.geojson
  bch_load_2021:
    url: https://www.bchydro.com/content/dam/BCHydro/customer-portal/documents/corporate/suppliers/transmission-system/balancing_authority_load_data/Historical%20Transmission%20Data/BalancingAuthorityLoad2021.xls
    dest: data/downloaded_data/load/bc_hydro_load/BalancingAuthorityLoad2021.xls # BC Hydro historical transmission data
  bch_load_2022:
    url: https://www.bchydro.com/content/dam/BCHydro/customer-portal/documents/corporate/suppliers/transmission-system/balancing_authority_load_data/Historical%20Transmission%20Data/BalancingAuthorityLoad2022.xls
    dest: data/downloaded_data/load/bc_hydro_load/BalancingAuthorityLoad2022.xls # BC Hydro historical transmission data

# ---------------------------------------------------------------- outputs
# Paths only. Any run-parameter that used to sit beside these lives in params.yaml.
output:
  base_network: data/processed_data/network

  create_hydro_assets:
    hydro_generation: data/processed_data/hydro/existing/hydro_generation.csv
    hydro_reservoir: data/processed_data/hydro/existing/hydro_reservoirs.csv
    hydro_cascade: data/processed_data/hydro/existing/hydro_cascade.csv

  reservoir_inflows:
    fname: data/processed_data/hydro/existing/bc_ext_reservoir_inflows.csv
  ror_ps:
    fname: data/processed_data/hydro/existing/bc_ext_ror_ts.csv
  create_ext_wind_assets:
    fname: data/processed_data/wind/existing/bc_ext_wind_assets.csv
  create_ext_wind_ts:
    fname: data/processed_data/wind/existing/bc_ext_wind_ts.csv
  create_ext_solar_assets:
    fname: data/processed_data/solar/existing/bc_ext_solar_assets.csv
  create_ext_solar_ts:
    fname: data/processed_data/solar/existing/bc_ext_solar_ts.csv
  create_ext_tpp_assets:
    fname: data/processed_data/tpp/existing/bc_ext_tpp_assets.csv

  disaggregate_load:
    province_2_RD_proportions: data/processed_data/load/CEEI_RD_ELEC_proportions.csv
    res_path: data/processed_data/load/hourly_res.csv
    csmi_path: data/processed_data/load/hourly_csmi.csv

  pypsa_dict:
    folder: data/pypsa_data/
    res: hydro_reservoirs.pickle
    ror: hydro_ror.pickle
    ror_water: hydro_ror_water.pickle
    wind: wind.pickle
    solar: solar.pickle
    tpp: tpp.pickle
    ff_infrastructure: ff_infra.pickle
    cogen: cogen.pickle

  build_model:
    fname: results/pypsa/PyPSA_BC_network_s.nc
