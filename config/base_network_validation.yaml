version: 1

# Broad modelling envelope used only to catch missing, swapped, or clearly
# out-of-scope coordinates. It is not a legal or administrative BC boundary.
geography:
  longitude_min: -139.2
  longitude_max: -114.0
  latitude_min: 48.0
  latitude_max: 60.1

connectivity:
  max_components: 1
  allow_isolated_buses: false

parameters:
  line_length_km:
    warn_below: 0.05
    warn_above: 500.0
  line_capacity_mva:
    warn_above: 5000.0

identifiers:
  # Several circuits may share endpoints and a display name. Source line IDs,
  # however, must remain unique at the prepared-line grain.
  duplicate_line_name_severity: warning
  duplicate_transmission_line_id_severity: error
